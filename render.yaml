# ==============================================================================
# AI TATHASTU — UNIVERSAL RESUME EXTRACTOR RENDER BLUEPRINT
# Deploy via: Render Dashboard -> Blueprints -> Connect aitathastu repository
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: aitathastu-resume-extractor
    branch: main
    runtime: docker
    rootDir: services/resume-extractor
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: EXTRACTOR_API_TOKEN
        generateValue: true
      # Must equal EXTRACTOR_VERIFIER_TOKEN on the Next app; leave unset to disable verifier calls.
      - key: EXTRACTOR_VERIFIER_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: MAX_UPLOAD_MB
        value: "4" # keep in sync with lib/config/upload-limits.ts
      - key: MAX_PAGES
        value: "20"
      - key: MAX_OCR_SECONDS
        value: "90"
      - key: MAX_PROCESSING_SECONDS
        value: "180"
      - key: WORKERS
        value: "2"
