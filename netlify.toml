# ==============================================================================
# AI TATHASTU — NETLIFY BUILD & DEPLOYMENT CONFIGURATION
# Next.js 15 App Router via @netlify/plugin-nextjs (OpenNext)
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  # Disable Next.js telemetry
  NEXT_TELEMETRY_DISABLED = "1"
  # Disable auto-migration at runtime — run migrations via npm run db:migrate
  DATABASE_AUTO_MIGRATE = "false"
  # Omit non-secret config flags from Netlify secret scanning to prevent false-positives on words like "production", "true", "false", or URLs
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,APP_BASE_URL,DATABASE_AUTO_MIGRATE,PILOT_MODE,INVITE_CODE_REQUIRED,ENABLE_LLM_EORA,ENABLE_GITHUB_LIVE,CORE_INGESTION_SECURITY_APPROVED,CLOUD_AI_ENABLED,CLOUD_AI_PROVIDER_ORDER,CLOUD_AI_GLOBAL_DAILY_LIMIT,CLOUD_AI_GLOBAL_MONTHLY_LIMIT,CLOUD_AI_MAX_PROVIDER_RETRIES,CLOUD_AI_MAX_TOKENS_PER_REQUEST,CORE_DISABLE_LIVE_LLM,ENABLE_STUDY_LPU_LIVE,ENABLE_PADHO_CODE_LIVE,ENABLE_ERIS_LIVE,ENABLE_MENTORMAZE_LIVE,PILOT_INVITE_CODES,NEXT_PUBLIC_RENDER_EXTRACTOR_URL,RESUME_EXTRACTOR_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ==============================================================================
# FUNCTIONS CONFIGURATION
# ==============================================================================

[functions]
  # Node.js 20 for all functions
  node_bundler = "nft"
  # Include specific binary assets needed by the OCR engine (keep total bundle well below 250 MB AWS Lambda limit)
  included_files = [
    "eng.traineddata",
    "node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm",
    "node_modules/tesseract.js-core/tesseract-core-simd-lstm.js",
    "node_modules/tesseract.js-core/tesseract-core-lstm.wasm",
    "node_modules/tesseract.js-core/tesseract-core-lstm.js",
    "node_modules/pdfjs-dist/cmaps/**",
    "node_modules/pdfjs-dist/standard_fonts/**"
  ]

# ==============================================================================
# SCHEDULED FUNCTION — replaces Vercel Cron
# Equivalent to: "0 4 * * *" (04:00 UTC daily)
# ==============================================================================

[functions."cleanup-stuck-syncs"]
  schedule = "0 4 * * *"

# ==============================================================================
# REDIRECTS & HEADERS
# ==============================================================================

# Ensure API routes are always handled by Netlify Functions (via Next.js adapter)
# Do NOT add manual redirects that override Next.js App Router behavior.
# The @netlify/plugin-nextjs adapter handles all routing automatically.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static assets: long cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================================================
# CONTEXT-SPECIFIC OVERRIDES
# ==============================================================================

# Deploy preview — uses preview-specific database if configured
[context.deploy-preview.environment]
  NETLIFY_CONTEXT = "deploy-preview"
  # Override DATABASE_URL with preview branch if PREVIEW_DATABASE_URL is set
  # DATABASE_URL = "$PREVIEW_DATABASE_URL"

# Branch deploys
[context.branch-deploy.environment]
  NETLIFY_CONTEXT = "branch-deploy"

# Production
[context.production.environment]
  NETLIFY_CONTEXT = "production"
